<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="icon/png" href="counter-icon.png">
    <title>Counter</title>
    <style>
      body {
        overflow: hidden;
        background-color: #020620;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }
      button {
        box-shadow: 0 0 10px yellow;
        background-color: transparent;
        color: white;
        font-weight: bold;
        border-radius: 10px;
        border: 2px solid white;
        margin: 10px;
        padding: 10px 20px;
        font-size: 16px;
      }
      h1 {
        color: white;
        font-size: 48px;
        margin-top: 20px;
        text-shadow: 0 0  50px cyan, 0 0 100px cyan, 0 0 150px cyan;
      }
      </style>
  </head>
  <body>
    <button id="increase" onclick="increase()">Increase</button>
    <button id="decrease" onclick="decrease()">Decrease</button>
    <button id="reset" onclick="reset()">Reset</button>
    <h1 id="count">0</h1>
        <video autoplay loop muted width="100%" height="300px" src="drone-delivery.webm">Sorry but your browser doesn't support webm files</video>
    <script src="Counter.js"></script>
  </body>
</html>
